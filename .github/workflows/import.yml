name: Import official powercontext
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and push
        run: |
          git clone --branch 2026-competition --single-branch https://github.com/oceanbase/powercontext.git /tmp/pc
          cd /tmp/pc
          rm -rf .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove workflows for import permission" || true
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin 2026-competition:official-import
